name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm test && npm run lint:ui
      - run: npm run build:examples && git diff --exit-code
      - run: npm run test:packages
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run review:patterns
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            everyday-shots/patterns
            test-results
